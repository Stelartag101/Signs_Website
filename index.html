<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Signpack Workbench</title>
  <link rel="stylesheet" href="style.css">
</head>
<body>

<div class="app-container">
  <aside class="sidebar">
    <div class="brand">
     <img src="https://madshaakansson.dk/tmsigns/Waypoint/2022/1x1/Overlay/White/Waypoint-W_Icon.png" alt="Logo" class="brand-logo">
      <div class="brand-text">
        <span class="title">Waypoint 2024</span>
        <span class="subtitle">SIGNPACK BROWSER</span>
      </div>
    </div>

    <nav class="sidebar-nav">
      <div class="nav-section">
        <h3>LAYER TYPE</h3>
        <div id="layer-list" class="filter-group">
          </div>
      </div>
    </nav>
    
    <div class="sidebar-footer">
      <span class="status-dot"></span>
    </div>
  </aside>

  <main class="content">
    <header class="top-bar">
       <div class="search-wrapper">
          <input type="text" id="search" placeholder="Search signs...">
      </div>
      <div class="filter-controls">
        <select id="filter-dim">
          <option value="All">All Sizes</option>
        </select>
        <select id="filter-color">
         <option value="All">All Colors</option>
       </select>
      </div>
  </header>

    <div id="grid" class="sign-grid">
      </div>
  </main>
</div>

<div id="toast" class="toast">COPIED TO CLIPBOARD</div>

<script src="app.js"></script>
</body>
</html>
